<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add a user</title>
</head>
<body>
<div align="center">
    <h1>Add a user</h1>
    <form th:action="@{/save}" th:object="${user}" method="post">
        <div>
            <label for="name">Name:</label>
            <input type="text" th:field="*{username}" id="name" placeholder="Name">
        </div>
        <br>

        <div>
            <label for="email">Email:</label>
            <input type="email" th:field="*{email}" id="email" placeholder="Email">
        </div>
        <br>

        <div>
            <label for="password">Password:</label>
            <input type="password" th:field="*{password}" id="password" placeholder="Password">
        </div>
        <br>

        <div>
            <label for="roles">Role:</label>
            <select th:field="*{roles}" id="roles" multiple>
                <option th:each="role : ${allRoles}"
                        th:value="${role.id}"
                        th:text="${role.rolename}">
                </option>
            </select>
        </div>
        <br>

        <input type="submit" value="Add users">
    </form>
</div>
</body>
</html>
